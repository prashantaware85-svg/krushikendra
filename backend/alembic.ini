# Alembic configuration — Krushi Seva backend.
# NOTE: the live URL always comes from the environment (DATABASE_URL via
# pydantic Settings, applied in alembic/env.py). This file's sqlalchemy.url
# is a local-development placeholder only and NEVER holds real credentials.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder only — overridden by env.py from Settings.database_url.
sqlalchemy.url = postgresql+psycopg://postgres:password@localhost:5432/krushi_seva

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
